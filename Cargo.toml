[package]
name = "nuki"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
envy = "0.4.2"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "query", "rustls"] }
rig-agent = "0.44.0"
rig-core = { version = "0.44.0", features = ["reqwest"] }
rquickjs = { version = "0.14.0", features = ["futures", "parallel"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = "0.12.5"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rusqlite = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util"] }
wiremock = "0.6.5"
